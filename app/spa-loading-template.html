<script>
  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
    navigator.userAgent
  );

  if (isMobile) {
    document.documentElement.classList.add('is-mobile');
  }

  const quotes = [
    'Hangolódás a hullámhosszra...',
    'Ütemek szinkronizálása a felhővel...',
    'Basszus optimalizálása...',
    'Lejátszási listák betöltése...',
    'Csatlakozás a zenei térhez...',
    'Kristálytiszta hangzás előkészítése...',
    'Készülj a dropra...'
  ];
  let quoteIdx = 0;
  const statusEl = document.getElementById('spa-loading-status');
  if (statusEl) {
    setInterval(() => {
      statusEl.style.opacity = '0';
      setTimeout(() => {
        quoteIdx = (quoteIdx + 1) % quotes.length;
        statusEl.textContent = quotes[quoteIdx];
        statusEl.style.opacity = '1';
      }, 250);
    }, 2200);
  }

  if (window.__TAURI_INTERNALS__ && !isMobile) {
    document.getElementById('spa-loading-titlebar').style.display = 'flex';

    window.__TAURI_INTERNALS__
      .invoke('plugin:window|is_maximized', { label: 'main' })
      .then((isMaximized) => {
        if (isMaximized) {
          document.getElementById('spa-icon-maximize').style.display = 'none';
          document.getElementById('spa-icon-restore').style.display = 'block';
        }
      })
      .catch(() => {});

    document.getElementById('spa-minimize').addEventListener('click', () => {
      window.__TAURI_INTERNALS__.invoke('plugin:window|minimize', { label: 'main' });
    });

    document.getElementById('spa-maximize').addEventListener('click', () => {
      window.__TAURI_INTERNALS__.invoke('plugin:window|toggle_maximize', { label: 'main' });
    });

    document.getElementById('spa-close').addEventListener('click', () => {
      window.__TAURI_INTERNALS__.invoke('plugin:window|close', { label: 'main' });
    });
  }
</script>
