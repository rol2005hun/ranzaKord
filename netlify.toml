[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--experimental-require-module"

[images]
  remote_images = [
    'https://.*\.googleusercontent\.com/.*',
    'https://.*\.ytimg\.com/.*',
    'https://.*\.spotifycdn\.com/.*',
    'https://.*\.scdn\.co/.*',
    'https://.*\.imgur\.com/.*'
  ]

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose", "jsdom"]
