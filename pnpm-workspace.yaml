packages:
  - '.'

overrides:
  vite-plugin-checker: 0.14.5
  '@intlify/shared': 11.4.19
  '@intlify/core-base': 11.4.19
  '@intlify/core': 11.4.19
  '@intlify/message-compiler': 11.4.19
  '@intlify/devtools-types': 11.4.19

peerDependencyRules:
  ignoreMissing:
    - '@unhead/vue'
    - pinia
    - '@pinia/nuxt'
  allowedVersions:
    '@unhead/vue': '*'
    pinia: '*'
    '@pinia/nuxt': '*'

minimumReleaseAgeExclude:
  - '@intlify/core-base@11.4.19'
  - '@intlify/devtools-types@11.4.19'
  - '@intlify/message-compiler@11.4.19'
  - '@intlify/shared@11.4.19'
  - prettier@3.10.1
  - vue-i18n@11.4.19
  - '@intlify/core@11.4.19'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
