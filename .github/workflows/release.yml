name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional, e.g. v0.2.0-alpha.2; defaults to v<package.json version>)'
        required: false
        default: ''
        type: string

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve_tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            if [[ "$TAG" != v* ]]; then
              TAG="v$TAG"
            fi
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved release tag: $TAG"

  release:
    needs: [init]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NUXT_PUBLIC_BASE_URL: ${{ secrets.NUXT_PUBLIC_BASE_URL }}
        with:
          tagName: ${{ needs.init.outputs.tag }}
          releaseName: 'Release ${{ needs.init.outputs.tag }}'
          releaseBody: 'Autogenerated release via GitHub Actions.'
          releaseDraft: false
          prerelease: true

  android:
    name: 'release (android)'
    needs: [init]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "ndk;27.0.12077973" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Initialize Tauri Android
        run: npx tauri android init --ci

      - name: Patch Tauri Android buildSrc for Gradle compatibility
        run: |
          sed -i 's/rootDirRel = config.rootDirRel/rootDirRel = config.rootDirRel\n                        projectDir = project.projectDir.absolutePath/g' src-tauri/gen/android/buildSrc/src/main/java/dev/ranzak/kord/kotlin/RustPlugin.kt || true
          sed -i 's/var projectDir: String? = null/@org.gradle.api.tasks.Optional\n    @org.gradle.api.tasks.Internal\n    var projectDir: String? = null/g' src-tauri/gen/android/buildSrc/src/main/java/dev/ranzak/kord/kotlin/BuildTask.kt || true
          sed -i 's/workingDir(File(projectDir, rootDirRel))/workingDir(File(projectDir ?: project.projectDir.absolutePath, rootDirRel))/g' src-tauri/gen/android/buildSrc/src/main/java/dev/ranzak/kord/kotlin/BuildTask.kt || true

      - name: Patch Gradle wrapper to compatible version
        run: |
          sed -i 's|distributions/gradle-.*-bin.zip|distributions/gradle-8.13-bin.zip|g' \
            src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties

      - name: Generate Android Icons
        run: npx tauri icon public/logo.webp

      - name: Inject Deep Link Intent Filter
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          INTENT='<intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><category android:name="android.intent.category.BROWSABLE" /><data android:scheme="ranzakord" /></intent-filter>'
          sed -i "s|</activity>|    $INTENT\n        </activity>|g" $MANIFEST

      - name: Build Android App
        env:
          NUXT_PUBLIC_BASE_URL: ${{ secrets.NUXT_PUBLIC_BASE_URL }}
        run: npx tauri android build --apk

      - name: Sign Android APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/ranzakord-release.keystore
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name "*.apk" | head -1)
          ALIGNED_APK="${APK_PATH%.apk}-aligned.apk"
          SIGNED_APK="${APK_PATH%.apk}-aligned-signed.apk"
          BUILD_TOOLS=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -V | tail -1)

          # 1. Zipalign FIRST
          /usr/local/lib/android/sdk/build-tools/$BUILD_TOOLS/zipalign -v -p 4 "$APK_PATH" "$ALIGNED_APK"

          # 2. apksigner LAST
          /usr/local/lib/android/sdk/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks $RUNNER_TEMP/ranzakord-release.keystore \
            --ks-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
            
          echo "SIGNED_APK=$SIGNED_APK" >> $GITHUB_ENV

      - name: Upload Android Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.init.outputs.tag }}
          name: 'Release ${{ needs.init.outputs.tag }}'
          body: 'Autogenerated release via GitHub Actions.'
          prerelease: true
          files: |
            ${{ env.SIGNED_APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
